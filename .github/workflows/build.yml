name: Build
on:
  push:
    tags:
      - 'v*.*.*'
env:
  APP: requestbin
  OS: linux
  ARCH: amd64
  CGO_ENABLED: 0
  DH_ROOT: dossif
jobs:
  Compile:
    runs-on: ubuntu-latest
    steps:
      - name: Get release version from git tag
        run: echo "VER=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Compile binary
        run: GOOS=${OS} GOARCH=${ARCH} go build -ldflags "-X main.AppVersion=${VER}" -o "${APP}" ./cmd/requestbin
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary
          path: ./${{ env.APP }}
  Dockerimage:
    needs: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Get release version from git tag
        run: echo "VER=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: binary
          path: .
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DH_ROOT }}/${{ env.APP }}:${{ env.VER }}
            ${{ env.DH_ROOT }}/${{ env.APP }}:latest
  Release:
    needs: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Get release version from git tag
        run: echo "VER=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: binary
          path: .
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ env.VER }}"
          tag_name: "v${{ env.VER }}"
          files: ./${{ env.APP }}
