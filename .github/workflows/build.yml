name: Build
on: [push]
env:
  APP: requestbin
  OS: linux
  ARCH: amd64
  TAG: 0.0.1
  DH_ROOT: dossif
jobs:
  Compile:
    runs-on: ubuntu-20.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.17
      - name: Compile binary
        run: GOOS=${OS} GOARCH=${ARCH} go build -ldflags "-X main.AppVersion=${TAG}" -o "${APP}" ./src/main
      - name: Upload artifacts
        uses: actions/upload-artifact@v2
        with:
          name: binary
          path: ./requestbin
  Dockerimage:
    needs: Compile
    runs-on: ubuntu-20.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      - name: Download artifacts
        uses: actions/download-artifact@v2
        with:
          name: binary
          path: .
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ env.DH_ROOT }}/${{ env.APP }}:${{ env.TAG }}
  Release:
    needs: Compile
    runs-on: ubuntu-20.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v2
        with:
          name: binary
          path: .
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ env.TAG }}"
          tag_name: "v${{ env.TAG }}"
          files: ./requestbin
